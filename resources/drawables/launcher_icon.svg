<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Night sky over deep water -->
  <rect width="240" height="240" fill="#02080d"/>
  <rect y="150" width="240" height="90" fill="#0f5068"/>
  <rect y="176" width="240" height="64" fill="#0a3a50"/>
  <rect y="204" width="240" height="36" fill="#06263a"/>
  <rect y="228" width="240" height="12" fill="#031524"/>
  <g transform="translate(-16,0)">
  <!-- Faint wake ripples behind the fin -->
  <path d="M 78 158 L 22 154" stroke="#2b8aa6" stroke-width="5" stroke-linecap="round"/>
  <path d="M 84 166 L 36 170" stroke="#2b8aa6" stroke-width="5" stroke-linecap="round"/>
  <!-- Dorsal fin: curved leading edge, hooked tip, concave trailing edge -->
  <path d="M 184 150 Q 150 66 84 26 Q 114 92 104 150 Z" fill="#9fb6c6"/>
  <path d="M 84 26 Q 114 92 104 150 L 130 150 Q 124 88 84 26 Z" fill="#52697a"/>
  <!-- White water at the base and the bow -->
  <ellipse cx="142" cy="152" rx="64" ry="8" fill="#e6f4f8"/>
  <ellipse cx="194" cy="150" rx="13" ry="6" fill="#e6f4f8"/>
  </g>
</svg>
